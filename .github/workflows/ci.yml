name: ci
on:
  push: { branches: [main] }
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: blast
          POSTGRES_PASSWORD: blast
          POSTGRES_DB: blastdb
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U blast" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]"
      - run: pytest -v
        env:
          BLAST_TEST_POSTGRES_URL: postgresql://blast:blast@127.0.0.1:5432/blastdb
